name: Deploy Automático e-Sigma Ágape

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executar comandos na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Clona o repositório na primeira vez ou atualiza nas próximas
            if [ ! -d "/var/www/agape/.git" ]; then
              mkdir -p /var/www/agape
              git clone https://github.com/mendesalm/agape.git /var/www/agape
            fi

            cd /var/www/agape
            git pull origin main

            # Executa o script de setup/atualização (Backend porta 8007 + Frontend + Systemd + Nginx)
            chmod +x deploy/setup_vps.sh
            sudo ./deploy/setup_vps.sh

name: Deploy Automático e-Sigma Ágape

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executar comandos na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Acessar a pasta onde o projeto Ágape está na VPS
            cd /var/www/agape
            git pull origin main

            # Atualiza e reinicia Backend (Porta 8007)
            source backend/venv/bin/activate
            pip install -r backend/requirements.txt
            sudo systemctl restart agape-api

            # Atualiza e compila Frontend
            cd frontend
            npm install
            npm run build

name: Deploy Automático e-Sigma Taverna

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executar comandos na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Acessar a pasta onde o projeto Taverna está na VPS
            cd /var/www/agape
            git pull origin main

            # Atualiza e reinicia Backend (Porta 8007)
            source backend/venv/bin/activate
            pip install -r backend/requirements.txt
            sudo systemctl restart agape-api

            # Atualiza e compila Frontend
            cd frontend
            npm install
            npm run build

            # Configura VirtualHost Nginx para taverna.e-sigma.app (se ainda não existir)
            if [ ! -f "/etc/nginx/sites-available/taverna.e-sigma.app" ]; then
              sudo cp /var/www/agape/deploy/taverna.e-sigma.app.nginx.conf /etc/nginx/sites-available/taverna.e-sigma.app
              sudo ln -sf /etc/nginx/sites-available/taverna.e-sigma.app /etc/nginx/sites-enabled/taverna.e-sigma.app
              sudo nginx -t && sudo systemctl reload nginx
              sudo certbot --nginx -d taverna.e-sigma.app --non-interactive --agree-tos --register-unsafely-without-email --redirect || true
            fi
